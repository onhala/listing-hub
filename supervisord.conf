[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.out.log
stderr_logfile=/var/log/xvfb.err.log

[program:fluxbox]
command=fluxbox -display :99
autorestart=true
priority=20
stdout_logfile=/var/log/fluxbox.out.log
stderr_logfile=/var/log/fluxbox.err.log

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -listen 127.0.0.1 -rfbport 5900
autorestart=true
priority=30
stdout_logfile=/var/log/x11vnc.out.log
stderr_logfile=/var/log/x11vnc.err.log

[program:websockify]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=40
stdout_logfile=/var/log/websockify.out.log
stderr_logfile=/var/log/websockify.err.log

[program:flask-app]
command=python /app/app.py
autorestart=true
priority=50
stdout_logfile=/var/log/flask.out.log
stderr_logfile=/var/log/flask.err.log
