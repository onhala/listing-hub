<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2d"/>
      <stop offset="100%" stop-color="#0a071b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Tag Icon Base -->
  <g transform="translate(40, 20)">
    <!-- Main Tag -->
    <path d="M 216 70 L 350 70 C 370 70 390 85 400 100 L 440 180 C 450 200 450 220 440 240 L 260 410 C 240 430 210 430 190 410 L 90 310 C 70 290 70 260 90 240 L 216 70 Z" 
          fill="url(#accent-grad)" filter="url(#glow)"/>
    
    <!-- Tag Hole -->
    <circle cx="245" cy="135" r="28" fill="#0a071b" stroke="#ffffff" stroke-width="6" stroke-opacity="0.5"/>
    
    <!-- Sparkle Lightbulb / AI Icon overlay -->
    <path d="M 260 210 Q 300 210 320 250 Q 330 280 300 310 Q 290 325 290 340 L 250 340 Q 250 325 240 310 Q 210 280 220 250 Q 240 210 260 210 Z" fill="url(#gold-grad)"/>
    <rect x="250" y="348" width="40" height="12" rx="4" fill="#ffffff"/>
    <rect x="256" y="364" width="28" height="8" rx="3" fill="url(#gold-grad)"/>
  </g>
</svg>
