# ==========================================================
# Listing Hub & AI Editor - Docker Compose Configuration
# Brand: TERMS a.s. / Roboton Custom Platform
# For: TrueNAS / Home Server Deployment behind Nginx Proxy
# ==========================================================

services:
  listing-hub:
    # build: .
    image: ghcr.io/onhala/listing-hub:latest
    container_name: listing-hub
    restart: unless-stopped
    ports:
      - "5001:5001" # Flask Web Interface
      - "6080:6080" # noVNC Interface (WebSockets)
    volumes:
      # Persistent configuration, data, and photos folders (Issue #3)
      - ./config:/app/config
      - ./data:/app/data
      - ./photos:/app/photos
      # Host folder mount for export (configurable via env var)
      - ${BAZOS_EXPORT_DIR:-./export}:/app/export
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
